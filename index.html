<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOOM BOOM BALL - Box Cricket Scoring</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#dff6ff,#fce4ec,#fff4d6);
    color:#172033;
}

header{
    background:linear-gradient(135deg,#087ea4,#7b2cbf,#ff4f9a);
    color:white;
    padding:22px 15px;
    text-align:center;
    border-radius:0 0 25px 25px;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:7px 0 0;
    opacity:.9;
}

.container{
    width:95%;
    max-width:900px;
    margin:20px auto;
}

.card{
    background:rgba(255,255,255,.9);
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 8px 25px rgba(50,50,93,.12);
}

h2{
    margin-top:0;
    color:#6a1b9a;
}

input,select,button{
    width:100%;
    padding:13px;
    margin:6px 0;
    border-radius:12px;
    border:1px solid #ccd5e0;
    font-size:16px;
}

button{
    border:0;
    background:linear-gradient(135deg,#08aeea,#7b2cbf);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.danger{
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
}

.success{
    background:linear-gradient(135deg,#00b09b,#96c93d);
}

.secondary{
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.run-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.run-grid button{
    font-size:20px;
    padding:17px 5px;
}

.scoreboard{
    text-align:center;
    background:linear-gradient(135deg,#081c3a,#164e63);
    color:white;
    border-radius:20px;
    padding:22px;
}

.score{
    font-size:42px;
    font-weight:bold;
}

.boom{
    background:linear-gradient(135deg,#ff0055,#ff9f00);
    color:white;
    padding:15px;
    text-align:center;
    border-radius:15px;
    font-size:22px;
    font-weight:bold;
    margin:10px 0;
}

.players{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.player-row{
    display:flex;
    align-items:center;
    gap:5px;
    background:#f5f8fc;
    padding:8px;
    border-radius:10px;
}

.player-row span{
    flex:1;
}

.small-btn{
    width:auto;
    padding:7px 10px;
    margin:0;
    font-size:13px;
}

.active{
    outline:3px solid #ff4f9a;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    text-align:center;
}

.stat{
    background:#eef8ff;
    padding:12px;
    border-radius:12px;
}

.hidden{
    display:none;
}

footer{
    text-align:center;
    padding:20px;
    color:#7b2cbf;
    font-weight:bold;
    font-size:18px;
}

@media(max-width:600px){
    .players{
        grid-template-columns:1fr;
    }

    .run-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .score{
        font-size:34px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🏏 BOOM BOOM BALL</h1>
    <p>Box Cricket Scoring App</p>
</header>

<div class="container">

<!-- MATCH SETUP -->
<div class="card" id="setupCard">

<h2>🏆 New Match</h2>

<input id="matchName" placeholder="Match name">

<h3>Team 1</h3>
<input id="team1Name" placeholder="Team 1 name">

<div id="team1Players"></div>
<button onclick="addPlayer(1)">➕ Add Player</button>

<h3>Team 2</h3>
<input id="team2Name" placeholder="Team 2 name">

<div id="team2Players"></div>
<button onclick="addPlayer(2)">➕ Add Player</button>

<h3>Overs</h3>

<select id="overs">
<option value="1">1 Over</option>
<option value="2">2 Overs</option>
<option value="3">3 Overs</option>
<option value="4">4 Overs</option>
<option value="5" selected>5 Overs</option>
<option value="6">6 Overs</option>
<option value="8">8 Overs</option>
<option value="10">10 Overs</option>
<option value="12">12 Overs</option>
<option value="15">15 Overs</option>
<option value="20">20 Overs</option>
<option value="25">25 Overs</option>
<option value="30">30 Overs</option>
<option value="40">40 Overs</option>
<option value="50">50 Overs</option>
</select>

<button onclick="startMatch()">🚀 Start Match</button>

</div>


<!-- TOSS -->
<div class="card hidden" id="tossCard">

<h2>🪙 Toss</h2>

<select id="tossWinner">
<option value="1">Team 1 won toss</option>
<option value="2">Team 2 won toss</option>
</select>

<select id="tossDecision">
<option value="bat">Choose Batting</option>
<option value="bowl">Choose Bowling</option>
</select>

<button onclick="finishToss()">Continue</button>

</div>


<!-- SCORING -->
<div id="scoringArea" class="hidden">

<div class="scoreboard">

<h2 id="battingTeam"></h2>

<div class="score">
<span id="runs">0</span>/<span id="wickets">0</span>
</div>

<div id="oversDisplay">0.0 overs</div>

</div>

<div id="boomMessage" class="boom hidden">
🔥 BOOM BOOM BALL 🔥
<br>
Last ball of the over!
</div>


<div class="card">

<h2>Players</h2>

<div class="stats">

<div class="stat">
<b>Striker</b>
<div id="strikerName">-</div>
</div>

<div class="stat">
<b>Non-Striker</b>
<div id="nonStrikerName">-</div>
</div>

<div class="stat">
<b>Bowler</b>
<div id="bowlerName">-</div>
</div>

</div>

</div>


<div class="card">

<h2>🎯 Choose Players</h2>

<select id="strikerSelect" onchange="changeStriker()"></select>

<select id="nonStrikerSelect" onchange="changeNonStriker()"></select>

<select id="bowlerSelect" onchange="changeBowler()"></select>

</div>


<div class="card">

<h2>🏏 Runs</h2>

<div class="run-grid">
<button onclick="scoreRun(0)">0</button>
<button onclick="scoreRun(1)">1</button>
<button onclick="scoreRun(2)">2</button>
<button onclick="scoreRun(3)">3</button>
<button onclick="scoreRun(4)">4</button>
<button onclick="scoreRun(5)">5</button>
<button onclick="scoreRun(6)">6</button>
</div>

<h3>Extras</h3>

<div class="run-grid">
<button onclick="extra(1,'WD')">WD</button>
<button onclick="extra(1,'NB')">NB</button>
<button onclick="extra(1,'BYE')">Bye</button>
<button onclick="extra(1,'LB')">LB</button>
</div>

<button class="danger" onclick="wicket()">💥 WICKET</button>

</div>


<div class="card">

<h2>📊 Current Player Analysis</h2>

<div id="playerAnalysis"></div>

</div>


<div class="card">

<button class="success" onclick="saveMatch()">💾 Save Match</button>

<button class="secondary" onclick="finishMatch()">🏁 Finish Match</button>

<button class="danger" onclick="newMatch()">🔄 New Match</button>

</div>

</div>


<!-- HISTORY -->

<div class="card">

<h2>📚 Past Matches</h2>

<div id="history"></div>

</div>

</div>

<footer>
    ✨ Created by Bhavya ✨
</footer>


<script>

let team1=[];
let team2=[];

let match=null;

let striker=null;
let nonStriker=null;
let bowler=null;

let playerStats={};

let matches=JSON.parse(localStorage.getItem("boomBoomMatches")||"[]");


function addPlayer(team){

    const name=prompt("Enter player name:");

    if(!name || !name.trim()) return;

    const player={
        id:Date.now()+Math.random(),
        name:name.trim()
    };

    if(team===1)
        team1.push(player);
    else
        team2.push(player);

    renderPlayers();
}


function removePlayer(team,index){

    if(team===1)
        team1.splice(index,1);
    else
        team2.splice(index,1);

    renderPlayers();
}


function renderPlayers(){

    document.getElementById("team1Players").innerHTML=
        team1.map((p,i)=>`
        <div class="player-row">
            <span>${p.name}</span>
            <button class="small-btn danger"
            onclick="removePlayer(1,${i})">Remove</button>
        </div>`).join("");

    document.getElementById("team2Players").innerHTML=
        team2.map((p,i)=>`
        <div class="player-row">
            <span>${p.name}</span>
            <button class="small-btn danger"
            onclick="removePlayer(2,${i})">Remove</button>
        </div>`).join("");
}


function startMatch(){

    const t1=document.getElementById("team1Name").value.trim();
    const t2=document.getElementById("team2Name").value.trim();

    if(!t1 || !t2){
        alert("Please enter both team names.");
        return;
    }

    if(team1.length<1 || team2.length<1){
        alert("Add at least 1 player to each team.");
        return;
    }

    match={
        id:Date.now(),
        name:document.getElementById("matchName").value || "Box Cricket Match",
        team1:t1,
        team2:t2,
        team1Players:JSON.parse(JSON.stringify(team1)),
        team2Players:JSON.parse(JSON.stringify(team2)),
        overs:Number(document.getElementById("overs").value),
        innings:1,
        battingTeam:1,
        runs:0,
        wickets:0,
        balls:0,
        history:[],
        finished:false,
        created:new Date().toLocaleString()
    };

    createStats(team1);
    createStats(team2);

    document.getElementById("setupCard").classList.add("hidden");
    document.getElementById("tossCard").classList.remove("hidden");
}


function createStats(team){

    team.forEach(p=>{
        playerStats[p.id]={
            name:p.name,
            runs:0,
            balls:0,
            fours:0,
            sixes:0,
            wickets:0
        };
    });
}


function finishToss(){

    let winner=Number(document.getElementById("tossWinner").value);
    let decision=document.getElementById("tossDecision").value;

    if(decision==="bat")
        match.battingTeam=winner;
    else
        match.battingTeam=winner===1?2:1;

    document.getElementById("tossCard").classList.add("hidden");
    document.getElementById("scoringArea").classList.remove("hidden");

    loadPlayers();

    updateUI();
}


function battingPlayers(){

    return match.battingTeam===1?
        match.team1Players:
        match.team2Players;
}


function bowlingPlayers(){

    return match.battingTeam===1?
        match.team2Players:
        match.team1Players;
}


function loadPlayers(){

    let bat=battingPlayers();
    let bowl=bowlingPlayers();

    document.getElementById("strikerSelect").innerHTML=
        bat.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");

    document.getElementById("nonStrikerSelect").innerHTML=
        bat.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");

    document.getElementById("bowlerSelect").innerHTML=
        bowl.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");

    if(bat.length>=1) striker=bat[0].id;
    if(bat.length>=2) nonStriker=bat[1].id;

    if(bowl.length>=1) bowler=bowl[0].id;

    syncSelectors();
}


function syncSelectors(){

    if(striker!==null)
        document.getElementById("strikerSelect").value=striker;

    if(nonStriker!==null)
        document.getElementById("nonStrikerSelect").value=nonStriker;

    if(bowler!==null)
        document.getElementById("bowlerSelect").value=bowler;
}


function changeStriker(){

    striker=document.getElementById("strikerSelect").value;

    if(striker===nonStriker){
        alert("Striker and non-striker cannot be same.");
        syncSelectors();
    }

    updateUI();
}


function changeNonStriker(){

    nonStriker=document.getElementById("nonStrikerSelect").value;

    if(striker===nonStriker){
        alert("Striker and non-striker cannot be same.");
        syncSelectors();
    }

    updateUI();
}


function changeBowler(){

    bowler=document.getElementById("bowlerSelect").value;

    updateUI();
}


function isBoomBall(){

    return match.balls>0 && match.balls%6===5;
}


function inningsFinished(){

    return match.balls >= match.overs*6;
}


function scoreRun(runs){

    if(match.finished){
        alert("Match is finished.");
        return;
    }

    if(inningsFinished()){
        alert("Innings completed.");
        return;
    }

    let boom=isBoomBall();

    let actualRuns=runs;

    if(boom)
        actualRuns=runs*2;

    match.runs+=actualRuns;

    if(striker!==null && playerStats[striker]){

        playerStats[striker].runs+=actualRuns;

        if(runs>0)
            playerStats[striker].balls++;

        if(runs===4)
            playerStats[striker].fours++;

        if(runs===6)
            playerStats[striker].sixes++;
    }

    if(runs>0 && striker!==null && playerStats[striker]){
        if(runs===0)
            playerStats[striker].balls++;
    }

    match.balls++;

    match.history.push({
        type:"run",
        raw:runs,
        actual:actualRuns,
        boom:boom,
        ball:match.balls
    });

    rotateStrikeAfterRuns(runs,boom);

    endOverIfNeeded();

    updateUI();
}


function rotateStrikeAfterRuns(rawRuns,boom){

    /*
       Normal cricket:
       1,3,5 rotate.
       2,4,6 stay.

       For BOOM BOOM BALL we use the
       final doubled runs for strike.
    */

    let runs=boom?rawRuns*2:rawRuns;

    if(runs%2===1){
        let temp=striker;
        striker=nonStriker;
        nonStriker=temp;
    }
}


function extra(value,type){

    if(match.finished || inningsFinished()) return;

    match.runs+=value;

    match.history.push({
        type:"extra",
        extra:type,
        runs:value,
        ball:match.balls
    });

    updateUI();
}


function wicket(){

    if(match.finished) return;

    if(inningsFinished()) return;

    let boom=isBoomBall();

    if(boom){

        match.runs-=5;

        alert("🔥 BOOM BOOM BALL WICKET!\n\n-5 runs deducted.");
    }

    match.wickets++;

    if(striker && playerStats[striker])
        playerStats[striker].balls++;

    match.balls++;

    match.history.push({
        type:"wicket",
        boom:boom,
        penalty:boom?-5:0,
        ball:match.balls
    });

    if(striker && playerStats[striker])
        playerStats[striker].out=true;

    endOverIfNeeded();

    updateUI();
}


function endOverIfNeeded(){

    if(match.balls>0 && match.balls%6===0){

        let temp=striker;
        striker=nonStriker;
        nonStriker=temp;

        alert("🏏 Over completed!\nStrike rotated.");
    }
}


function updateUI(){

    document.getElementById("battingTeam").innerText=
        match.battingTeam===1?match.team1:match.team2;

    document.getElementById("runs").innerText=match.runs;
    document.getElementById("wickets").innerText=match.wickets;

    let over=Math.floor(match.balls/6);
    let ball=match.balls%6;

    document.getElementById("oversDisplay").innerText=
        `${over}.${ball} / ${match.overs} overs`;

    let boom=isBoomBall() && !inningsFinished();

    document.getElementById("boomMessage")
        .classList.toggle("hidden",!boom);

    let strikerObj=findPlayer(striker);
    let nonObj=findPlayer(nonStriker);
    let bowlerObj=findPlayer(bowler);

    document.getElementById("strikerName").innerText=
        strikerObj?strikerObj.name:"-";

    document.getElementById("nonStrikerName").innerText=
        nonObj?nonObj.name:"-";

    document.getElementById("bowlerName").innerText=
        bowlerObj?bowlerObj.name:"-";

    renderAnalysis();
}


function findPlayer(id){

    return [...team1,...team2].find(p=>String(p.id)===String(id));
}


function renderAnalysis(){

    let bat=battingPlayers();

    document.getElementById("playerAnalysis").innerHTML=
        bat.map(p=>{

            let s=playerStats[p.id]||{
                runs:0,
                balls:0,
                fours:0,
                sixes:0
            };

            return `
            <div class="player-row">
                <span>
                <b>${p.name}</b><br>
                ${s.runs} runs (${s.balls} balls)
                • ${s.fours} fours
                • ${s.sixes} sixes
                </span>
            </div>
            `;

        }).join("");
}


function saveMatch(){

    if(!match){
        alert("No match available.");
        return;
    }

    let saved={
        ...match,
        playerStats:JSON.parse(JSON.stringify(playerStats)),
        savedAt:new Date().toLocaleString()
    };

    let index=matches.findIndex(m=>m.id===match.id);

    if(index>=0)
        matches[index]=saved;
    else
        matches.unshift(saved);

    localStorage.setItem(
        "boomBoomMatches",
        JSON.stringify(matches)
    );

    renderHistory();

    alert("✅ Match saved successfully!");
}


function finishMatch(){

    if(!match) return;

    match.finished=true;

    saveMatch();

    alert("🏆 Match finished and saved!");
}


function renderHistory(){

    let box=document.getElementById("history");

    if(matches.length===0){
        box.innerHTML="<p>No saved matches yet.</p>";
        return;
    }

    box.innerHTML=matches.map((m,i)=>`

        <div class="card">

        <h3>🏏 ${m.name}</h3>

        <p>
        ${m.team1} vs ${m.team2}
        </p>

        <p>
        ${m.runs}/${m.wickets}
        • ${Math.floor(m.balls/6)}.${m.balls%6}
        overs
        </p>

        <p>
        ${m.savedAt||m.created}
        </p>

        <button onclick="viewMatch(${i})">
        📊 Analyse Match
        </button>

        <button class="danger"
        onclick="deleteMatch(${i})">
        🗑 Delete
        </button>

        </div>

    `).join("");
}


function viewMatch(index){

    let m=matches[index];

    let stats=m.playerStats||{};

    let text=
        `🏏 ${m.name}\n\n`+
        `${m.team1}: ${m.team1Players.map(p=>p.name).join(", ")}\n`+
        `${m.team2}: ${m.team2Players.map(p=>p.name).join(", ")}\n\n`+
        `Score: ${m.runs}/${m.wickets}\n`+
        `Overs: ${Math.floor(m.balls/6)}.${m.balls%6}\n\n`+
        `PLAYER ANALYSIS\n\n`;

    Object.values(stats).forEach(p=>{

        text+=
            `${p.name}: ${p.runs} runs, `+
            `${p.balls} balls, `+
            `${p.fours} fours, `+
            `${p.sixes} sixes\n`;

    });

    alert(text);
}


function deleteMatch(index){

    if(!confirm("Delete this saved match?")) return;

    matches.splice(index,1);

    localStorage.setItem(
        "boomBoomMatches",
        JSON.stringify(matches)
    );

    renderHistory();
}


function newMatch(){

    if(!confirm("Start a new match?")) return;

    location.reload();
}


renderPlayers();
renderHistory();

</script>

</body>
</html>
